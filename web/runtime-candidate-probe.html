<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>XRAI runtime candidate probe</title>
</head>
<body>
  <button id="auth" type="button">Authorize temporary AI session</button>
  <pre id="status">ready</pre>
  <script src="https://js.puter.com/v2/"></script>
  <script type="module">
    const status=document.querySelector('#status');
    const write=value=>{status.textContent=JSON.stringify(value,null,2)};
    globalThis.__xraiCandidate={};

    globalThis.__xraiCandidate.runLifo=async()=>{
      const {Sandbox}=await import('https://cdn.jsdelivr.net/npm/@lifo-sh/core@0.10.17/+esm');
      const files={
        '/home/user/package.json':JSON.stringify({name:'xrai-lifo-probe',private:true,scripts:{test:'node test.js'}},null,2),
        '/home/user/test.js':"console.log('XRAI_LIFO_OK')\n"
      };
      const sandbox=await Sandbox.create({files,cwd:'/home/user',persist:false});
      const node=await sandbox.commands.run('node test.js',{cwd:'/home/user',timeout:30000});
      const install=await sandbox.commands.run('npm install is-number@7.0.0',{cwd:'/home/user',timeout:90000});
      const requireCheck=await sandbox.commands.run("node -e \"console.log(require('is-number')(7))\"",{cwd:'/home/user',timeout:30000});
      const test=await sandbox.commands.run('npm test',{cwd:'/home/user',timeout:30000});
      const result={crossOriginIsolated:Boolean(globalThis.crossOriginIsolated),node,install,requireCheck,test};
      write({lifo:result});
      return result;
    };

    document.querySelector('#auth').addEventListener('click',async()=>{
      try{
        if(!globalThis.puter?.auth?.isSignedIn?.())await globalThis.puter.auth.signIn({attempt_temp_user_creation:true});
        const user=await globalThis.puter.auth.getUser();
        globalThis.__xraiCandidate.puterAuth={ok:true,isTemp:Boolean(user?.is_temp),username:user?.username||null};
      }catch(error){
        globalThis.__xraiCandidate.puterAuth={ok:false,error:String(error?.message||error)};
      }
      write({puterAuth:globalThis.__xraiCandidate.puterAuth});
    });

    globalThis.__xraiCandidate.runPuter=async()=>{
      if(!globalThis.__xraiCandidate.puterAuth?.ok)throw new Error('Puter auth was not established from a user gesture');
      const response=await globalThis.puter.ai.chat([
        {role:'system',content:'Follow the user instruction exactly.'},
        {role:'user',content:'Reply with only XRAI_OK and no punctuation or explanation.'}
      ],{model:'openai/gpt-5.6-luna',normalize:true,max_tokens:16,temperature:0});
      const text=String(response?.message?.content||'').trim();
      const result={text,finishReason:response?.finish_reason||null,normalized:Boolean(response?.normalized)};
      write({puter:result});
      return result;
    };
  </script>
</body>
</html>
