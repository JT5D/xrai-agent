name: Deploy XRAI Agent Pages

# One-time prerequisite: in GitHub Settings > Pages, set Source to GitHub Actions.
# After that, run this workflow manually. Keeping deploy manual avoids a permanent
# failing check while Pages is disabled and prevents source/deployment drift.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Build static Pages artifact
        run: |
          mkdir -p _site
          cp -R web/. _site/
          cp -R knowledge _site/knowledge
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
