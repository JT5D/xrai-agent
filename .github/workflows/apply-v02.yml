name: Apply XRAI v0.2 exact build
on:
  push:
    branches: [master]
permissions:
  contents: write
jobs:
  apply:
    if: ${{ github.event.head_commit.message == 'Stage exact XRAI v0.2 build' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Replace repository with verified v0.2 tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 - <<'PY'
          import os, subprocess
          keep={'.xrai-sync/source.tgz','.github/workflows/apply-v02.yml'}
          for p in subprocess.check_output(['git','ls-files'],text=True).splitlines():
              if p not in keep and os.path.isfile(p):
                  os.remove(p)
          PY
          tar -xzf .xrai-sync/source.tgz
          rm -rf .xrai-sync
          rm -f .github/workflows/apply-v02.yml
          npm run check
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Upgrade XRAI Agent to v0.2 evidence-gated skill evolution"
          git push origin HEAD:master
