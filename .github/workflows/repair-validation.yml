name: Verify public real-model inference
on:
  push:
    branches: [repair/context-isolated-9100b6]
permissions:
  contents: read
jobs:
  inference:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 2d2aae0308caacb42d15d9ff31bbfe633b3a616b
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save --ignore-scripts playwright@1.55.0
      - name: Exercise real local-model CPU fallback
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('test/live-pages.e2e.mjs')
          s=p.read_text()
          old="const softwareWebGpu=flow==='model-runtime';"
          assert old in s
          p.write_text(s.replace(old,"const softwareWebGpu=false; // Real CPU fallback; no model mock and no forced software GPU."))
          PY
          node test/live-pages.e2e.mjs https://jt5d.github.io/xrai-agent/ model-runtime
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: independent-real-model-evidence
          path: artifacts/
          retention-days: 7
