name: Validate conversation repair
on:
  push:
    branches: [repair/verified-context-20260913]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply exact reviewed repair
        run: |
          python3 - <<'PY'
          import json,hashlib,gzip,base64
          from pathlib import Path
          payload=json.loads(Path('.repair.json').read_text())
          if isinstance(payload,dict):
              raw=gzip.decompress(base64.b64decode(payload['gzip']))
              assert hashlib.sha256(raw).hexdigest()==payload['sha256']
              payload=json.loads(raw)
          for entry in payload:
              p=Path(entry['path'])
              assert not p.is_absolute() and '..' not in p.parts
              if 'text' in entry:
                  p.parent.mkdir(parents=True,exist_ok=True)
                  p.write_text(entry['text'])
              else:
                  assert hashlib.sha256(p.read_bytes()).hexdigest()==entry['sha'],str(p)
                  lines=p.read_text().splitlines(True)
                  for start,end,text in reversed(entry['hunks']):
                      assert 0 <= start <= end <= len(lines), str(p)
                      lines[start:end]=[text]
                  p.write_text(''.join(lines))
          p=Path('package.json');data=json.loads(p.read_text());data['version']='0.3.48';p.write_text(json.dumps(data,indent=2)+'\n')
          p=Path('README.md');p.write_text(p.read_text().replace('v0.3.47','v0.3.48').replace('The evaluator remains internal evidence for learning; it is not the product response.','The evaluator supplies internal estimates, not execution proof. Browser suggestions remain candidates until a real verifier receipt exists. Sandbox patches are not committed or deployed.'))
          PY
      - name: Source checks
        run: npm run check > source-checks.txt 2>&1
      - name: Browser contract checks
        if: success()
        run: |
          npm install --no-save --ignore-scripts playwright@1.55.0
          node test/conversation.e2e.mjs
      - name: Export source and evidence
        if: always()
        run: |
          mkdir -p artifacts
          cp source-checks.txt artifacts/ || true
          tar --exclude=node_modules --exclude=.git --exclude=artifacts -czf artifacts/source.tar.gz README.md package.json src web test knowledge .github
      - name: Create tested commit without repair infrastructure
        if: success()
        run: |
          git config user.name JT5D
          git config user.email jtunick@theimclab.com
          git rm --ignore-unmatch .repair.json .github/workflows/repair-validation.yml
          git add README.md web test package.json .github/workflows/pages.yml
          tree=$(git write-tree)
          commit=$(printf '%s\n' 'Fix conversation context, serialized execution, research relevance and evidence integrity' | git commit-tree "$tree" -p 69c3440e4368820147de9ee8c53de6f92cc1fc08)
          git push origin "$commit:refs/heads/repair/verified-context-tested-20260913"
          printf '%s\n' "$commit" > artifacts/tested-commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: conversation-repair-validation
          path: artifacts/
          retention-days: 7
