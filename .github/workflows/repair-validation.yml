name: Validate conversation repair
on:
  push:
    branches: [repair/verified-context-20260913]
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        flow: [model-runtime, mobile-repo]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 2d2aae0308caacb42d15d9ff31bbfe633b3a616b
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install browser test dependency
        run: npm install --no-save --ignore-scripts playwright@1.55.0
      - name: Exercise real deployed runtime
        run: xvfb-run -a node test/live-pages.e2e.mjs https://jt5d.github.io/xrai-agent/ ${{ matrix.flow }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: final-live-${{ matrix.flow }}
          path: artifacts/
          retention-days: 7
