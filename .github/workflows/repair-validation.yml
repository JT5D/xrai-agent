name: Validate verified learning
on:
  push:
    branches: [repair/verified-learning-0348]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Preserve current master and apply only learning upgrade
        run: |
          mkdir -p /tmp/xrai-upgrade/web /tmp/xrai-upgrade/test
          cp .upgrade.py /tmp/xrai-upgrade/
          cp web/verified-repair.js /tmp/xrai-upgrade/web/
          cp test/verified-repair.test.js test/learning.e2e.mjs /tmp/xrai-upgrade/test/
          git checkout --detach 0da407af28cfecbdaac3e6dc0d37826bcc38dd28
          cp /tmp/xrai-upgrade/web/* web/
          cp /tmp/xrai-upgrade/test/* test/
          python3 /tmp/xrai-upgrade/.upgrade.py
          python3 - <<'PY'
          from pathlib import Path
          import json
          p=Path('web/app.js');s=p.read_text();old='livePatch?.runId===ui.result?.runId?';assert old in s;p.write_text(s.replace(old,'livePatch&&livePatch.runId===ui.result?.runId?'))
          p=Path('test/state.test.js');s=p.read_text();old='assert.equal(loaded.result.diff.length,50000)';assert old in s;p.write_text(s.replace(old,"assert.equal(loaded.result.diff,'','oversized patches must not be persisted as corrupt truncated diffs')")+"\ntest('complete small patches survive persistence unchanged',()=>{const storage=new MemoryStorage(),state=defaultUiState();const diff='diff --git a/a.js b/a.js\\n--- a/a.js\\n+++ b/a.js\\n@@ -1 +1 @@\\n-a\\n+b\\n';state.result={diff};saveUiState(storage,state);assert.equal(loadUiState(storage).result.diff,diff)});\n")
          p=Path('test/learning.e2e.mjs');p.write_text(p.read_text().replace('await page.route(','await context.route('))
          p=Path('package.json');data=json.loads(p.read_text());data['version']='0.3.50';p.write_text(json.dumps(data,indent=2)+'\n')
          for p in [Path('README.md'),*Path('web').glob('*.js'),*Path('web').glob('*.html')]:
              p.write_text(p.read_text().replace('0.3.49','0.3.50'))
          PY
      - name: Source and actual subprocess repair checks
        run: npm run check > source-checks.txt 2>&1
      - name: Browser conversation and actual WebContainer repair checks
        run: |
          npm install --no-save --ignore-scripts playwright@1.55.0
          node test/conversation.e2e.mjs
          xvfb-run -a node test/learning.e2e.mjs
      - name: Export evidence
        if: always()
        run: |
          mkdir -p artifacts
          cp source-checks.txt artifacts/ || true
          git diff --stat > artifacts/change-summary.txt
          tar --exclude=node_modules --exclude=.git --exclude=artifacts -czf artifacts/source.tar.gz README.md package.json src web test knowledge .github
      - name: Commit only verified application changes
        run: |
          git config user.name JT5D
          git config user.email jtunick@theimclab.com
          git add README.md web test package.json
          git commit -m 'Add verified repair tools, persisted reuse and rollback'
          git push origin HEAD:refs/heads/repair/verified-learning-tested-0350
          git rev-parse HEAD > artifacts/tested-commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verified-learning-validation
          path: artifacts/
          retention-days: 7
