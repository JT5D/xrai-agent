name: Verify deployed patch export
on:
  push:
    branches: [repair/patch-export-3a7e1b18]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 349e7122bf465720abe299f0043daa662f1d9e59
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify deployed source snapshot
        run: |
          mkdir -p artifacts
          python3 - <<'PY'
          import hashlib,json,time,urllib.request
          from pathlib import Path
          base='https://jt5d.github.io/xrai-agent/'
          sha='349e7122bf465720abe299f0043daa662f1d9e59'
          files=['browser-workspace.js','app.js','index.html']
          expected={name:hashlib.sha256(Path('web',name).read_bytes()).hexdigest() for name in files}
          report={'expected_commit':sha,'base':base,'expected':expected,'attempts':[],'ok':False}
          for attempt in range(20):
              observed={}
              for name in files:
                  try:
                      req=urllib.request.Request(base+name+'?verify='+sha,headers={'Cache-Control':'no-cache'})
                      with urllib.request.urlopen(req,timeout=10) as r: observed[name]=hashlib.sha256(r.read()).hexdigest()
                  except Exception as e: observed[name]=str(e)
              report['attempts'].append(observed)
              if observed==expected: report['ok']=True;break
              time.sleep(3)
          Path('artifacts/deployed-source.json').write_text(json.dumps(report,indent=2))
          assert report['ok'],'Public source did not match tested commit'
          print('Public source matches tested commit',sha)
          PY
      - run: npm install --no-save --ignore-scripts playwright@1.56.1
      - name: Exercise actual public download flow
        run: node test/patch-export.e2e.mjs https://jt5d.github.io/xrai-agent/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-patch-export
          path: artifacts/
          retention-days: 7
