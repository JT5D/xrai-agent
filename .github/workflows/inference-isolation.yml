name: Isolate real browser inference
on:
  push:
    branches: [repair/inference-isolation-20260913]
permissions:
  contents: read
jobs:
  isolate:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    strategy:
      fail-fast: false
      matrix:
        profile: [cpu, gpu, precision]
    env:
      PROFILE: ${{ matrix.profile }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --ignore-scripts playwright@1.56.1
      - run: node test/inference-candidate-probe.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: inference-${{ matrix.profile }}
          path: artifacts/
          retention-days: 7
