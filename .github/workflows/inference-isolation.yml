name: Isolate real browser inference
on:
  push:
    branches: [repair/inference-isolation-20260913]
permissions:
  contents: read
jobs:
  isolate:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      PROFILE: cpu
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --ignore-scripts playwright@1.56.1
      - name: Validate one coding-capable CPU candidate
        run: |
          sed -i 's#onnx-community/Qwen3-0.6B-ONNX#onnx-community/Qwen2.5-Coder-1.5B-Instruct#g' test/inference-candidate-probe.mjs
          node test/inference-candidate-probe.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: inference-coder-cpu
          path: artifacts/
          retention-days: 7
