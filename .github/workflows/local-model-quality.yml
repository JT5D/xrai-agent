name: Validate local model quality
on:
  push:
    branches: [repair/local-model-quality]
permissions:
  contents: read
jobs:
  reference:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 0da407af28cfecbdaac3e6dc0d37826bcc38dd28
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save --ignore-scripts playwright@1.55.0
      - name: Run actual CPU model reference
        run: |
          mkdir -p artifacts
          node --input-type=module <<'JS'
          import {chromium} from 'playwright';
          import fs from 'node:fs/promises';
          const browser=await chromium.launch({channel:'chrome',headless:true});
          const page=await browser.newPage();
          const result={backend:'wasm',model:'onnx-community/LFM2.5-350M-ONNX',version:'4.0.1',mocked:false,checks:[]};
          const timer=setTimeout(()=>process.exit(124),180000);
          try{
            await page.goto('https://jt5d.github.io/xrai-agent/',{waitUntil:'domcontentloaded'});
            await page.waitForFunction(()=>document.querySelector('#modeLabel')?.textContent==='browser',{},{timeout:30000});
            result.checks=await page.evaluate(async()=>{
              const {pipeline}=await import('https://cdn.jsdelivr.net/npm/@huggingface/transformers@4.0.1');
              const generator=await pipeline('text-generation','onnx-community/LFM2.5-350M-ONNX',{device:'wasm',dtype:'q4'});
              const cases=[
                [{role:'system',content:'You are a helpful assistant.'},{role:'user',content:'What is 2 + 2? Reply with only the number.'}],
                [{role:'system',content:'You are XRAI, a concise helpful assistant. Use the conversation to answer the latest request. You have no execution tools this turn: never claim commands, edits, installations, deployment or verified improvements. Prior replies are not proof.'},{role:'user',content:'What is 2 + 2? Reply with only the number.'}],
                [{role:'system',content:'Use the conversation to answer briefly.'},{role:'user',content:'Our project codename is Cedar.'},{role:'assistant',content:'Understood.'},{role:'user',content:'What is our project codename? Reply with only its name.'}]
              ];
              const rows=[];
              for(const messages of cases){const started=Date.now();const out=await generator(messages,{max_new_tokens:32,do_sample:false,repetition_penalty:1.05});rows.push({messages,output:out[0].generated_text.at(-1).content,ms:Date.now()-started})}
              return rows;
            });
            result.ok=/\b4\b/.test(result.checks[0].output)&&/\b4\b/.test(result.checks[1].output)&&/cedar/i.test(result.checks[2].output);
          }catch(error){result.error=String(error);result.ok=false}
          finally{clearTimeout(timer);await fs.writeFile('artifacts/cpu-reference.json',JSON.stringify(result,null,2));await browser.close()}
          console.log(JSON.stringify(result));if(!result.ok)process.exitCode=1;
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: local-model-cpu-reference
          path: artifacts/
          retention-days: 7
