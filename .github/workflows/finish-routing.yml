name: Validate combined transcript repairs
on:
  push:
    branches: [repair/transcript-routing-0349]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Merge reviewed candidates and preserve concurrent fixes
        run: |
          git config user.name JT5D
          git config user.email jtunick@theimclab.com
          git checkout --detach 64df434005e07e16023fb5a8091ebd06d86b0df4
          git merge --no-commit --no-ff 9fcdffac00a9f7ed9932656334a2d6c9142d1858 || test "$(git diff --name-only --diff-filter=U)" = 'web/conversation-context.js'
          git show 9fcdffac00a9f7ed9932656334a2d6c9142d1858:web/conversation-context.js > web/conversation-context.js
          python3 - <<'PY'
          from pathlib import Path
          p=Path('web/conversation-context.js');s=p.read_text()
          old='return isContextualFollowup(text)||';new=r'return /^(?:did|have|has|was|were|is|are|what|which)\b[\s\S]*\b(?:improvements?|plans?|changes?|executed|implemented|installed|verified|done|finished|working)\b/i.test(text)||isContextualFollowup(text)||'
          assert old in s;s=s.replace(old,new)
          old="export function executionIntent(task='',context={}){";new=old+"\n  "+r"task=task.trim().replace(/^(?:can|could|would)\s+you\s+(?:please\s+)?(?=(?:fix|repair|implement|install|refactor|modify|edit|patch|execute|run|verify)\b)/i,'');"
          assert old in s;s=s.replace(old,new)
          # Preserve the concurrent fix for edit/patch/repair and mixed test-fix requests.
          lines=s.splitlines();i=next(i for i,line in enumerate(lines) if "const target=isContinuation(task)" in line)
          lines[i+1]=r"  return /\b(?:fix|repair|edit|patch|change)\b/i.test(target.replace(/\b(?:fix|repair)\s+(?:(?:any|the)\s+)?(?:failed|failing|broken)\s+tests?\b/ig,''))||/\b(?:improve|improvements?|implement|install|integrate|refactor|modify|add|recommendations?)\b/i.test(target);"
          p.write_text('\n'.join(lines)+'\n')
          PY
          git add web/conversation-context.js
          test -z "$(git diff --name-only --diff-filter=U)"
      - name: Verify combined source and conversation UI
        run: |
          mkdir -p artifacts
          npm run check > artifacts/source-checks.txt 2>&1
          npm install --no-save --ignore-scripts playwright@1.55.0
          node test/conversation.e2e.mjs
      - name: Publish clean tested candidate
        run: |
          git add web test package.json README.md
          tree=$(git write-tree)
          commit=$(printf '%s\n' 'Merge verified transcript routing with concurrent context and history fixes' | git commit-tree "$tree" -p 64df434005e07e16023fb5a8091ebd06d86b0df4 -p 9fcdffac00a9f7ed9932656334a2d6c9142d1858)
          git push origin "$commit:refs/heads/repair/transcript-routing-0349-merged"
          printf '%s\n' "$commit" > artifacts/tested-commit.txt
      - name: Export source
        if: always()
        run: tar -czf artifacts/source.tar.gz README.md package.json web test src knowledge .github
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: transcript-routing-validation
          path: artifacts/
          retention-days: 7
