name: Validate transcript routing
on:
  push:
    branches: [repair/transcript-routing-0349]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply reviewed patch with baseline hashes
        run: |
          python3 - <<'PY'
          import base64,gzip,hashlib,json
          from pathlib import Path
          packed=''
          raw=gzip.decompress(base64.b64decode(packed))
          assert hashlib.sha256(raw).hexdigest()=='7f024d1b93f8be5de89f2819d3a41f0f46637af4dc12f991f6ffed91f1c5959e'
          for e in json.loads(raw):
              p=Path(e['path']);assert not p.is_absolute() and '..' not in p.parts
              if 'text' in e:p.write_text(e['text'])
              else:
                  assert hashlib.sha256(p.read_bytes()).hexdigest()==e['sha'],str(p)
                  lines=p.read_text().splitlines(True)
                  for a,b,s in reversed(e['hunks']):lines[a:b]=[s]
                  p.write_text(''.join(lines))
          PY
      - name: Verify source and conversation UI
        run: |
          mkdir -p artifacts
          npm run check > artifacts/source-checks.txt 2>&1
          npm install --no-save --ignore-scripts playwright@1.55.0
          node test/conversation.e2e.mjs
      - name: Publish clean tested candidate
        run: |
          git config user.name JT5D
          git config user.email jtunick@theimclab.com
          git rm .github/workflows/finish-routing.yml
          git add web test package.json README.md
          tree=$(git write-tree)
          commit=$(printf '%s\n' 'Fix exact transcript research and follow-up execution routing' | git commit-tree "$tree" -p be6ddc2bf09208c92051b08a766ee007779cc035)
          git push origin "$commit:refs/heads/repair/transcript-routing-0349-tested"
          printf '%s\n' "$commit" > artifacts/tested-commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: transcript-routing-validation
          path: artifacts/
          retention-days: 7
