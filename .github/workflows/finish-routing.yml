name: Validate final transcript repairs
on:
  push:
    branches: [repair/transcript-routing-0349]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Merge with latest master without discarding concurrent changes
        run: |
          git config user.name JT5D
          git config user.email jtunick@theimclab.com
          git fetch origin master
          base=$(git rev-parse origin/master)
          printf '%s' "$base" > /tmp/xrai-base
          git checkout --detach "$base"
          git merge --no-commit --no-ff cb221b9e5da54ca974d63cbbcc927ac1e2712c25 || test "$(git diff --name-only --diff-filter=U)" = 'web/app.js'
          if git diff --name-only --diff-filter=U | grep -q '^web/app.js$'; then
            git show "$base:web/app.js" > web/app.js
          fi
          python3 - <<'PY'
          from pathlib import Path
          p=Path('web/app.js');s=p.read_text()
          if 'const inherited=resolvedTask(task,context);' not in s:
              old='const inherited=isRetryFollowup(task)&&context.goal?context.goal:task;'
              assert old in s
              s=s.replace(old,'const inherited=resolvedTask(task,context);')
          if 'requestsChanges,resolvedTask }' not in s:
              assert 'requestsChanges }' in s
              s=s.replace('requestsChanges }','requestsChanges,resolvedTask }')
          p.write_text(s)
          p=Path('test/builtin-routing.test.js')
          if p.exists():
              s=p.read_text().replace('{executionIntent,','{resolvedTask,executionIntent,').replace("new Function('isRetryFollowup',","new Function('resolvedTask',").replace('make(isRetryFollowup,','make(resolvedTask,')
              p.write_text(s)
          PY
          git add web/app.js test/builtin-routing.test.js
          test -z "$(git diff --name-only --diff-filter=U)"
      - name: Verify source and conversation UI
        run: |
          mkdir -p artifacts
          npm run check > artifacts/source-checks.txt 2>&1
          npm install --no-save --ignore-scripts playwright@1.55.0
          node test/conversation.e2e.mjs
      - name: Publish clean tested candidate
        run: |
          git add web test package.json README.md
          tree=$(git write-tree)
          commit=$(printf '%s\n' 'Integrate validated exact-transcript routing and dispatcher regressions' | git commit-tree "$tree" -p "$(cat /tmp/xrai-base)" -p cb221b9e5da54ca974d63cbbcc927ac1e2712c25)
          git push origin "$commit:refs/heads/repair/transcript-routing-final"
          printf '%s\n' "$commit" > artifacts/tested-commit.txt
      - name: Export source
        if: always()
        run: tar -czf artifacts/source.tar.gz README.md package.json web test src knowledge .github
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: transcript-routing-validation
          path: artifacts/
          retention-days: 7
