name: XRAI source CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-ci-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm run check
      - name: Verify browser-to-server execution contract
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.1
          node test/server-ui.e2e.mjs
      - name: Upload execution contract evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-ui-contract
          path: artifacts/server-ui/
          retention-days: 7
