name: XRAI source CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-ci-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm run check
      - name: Verify browser-to-server execution contract
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.1
          node test/server-ui.e2e.mjs
      - name: Upload execution contract evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-ui-contract
          path: artifacts/server-ui/
          retention-days: 7

  model-qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser runner
        run: npm install --no-save --ignore-scripts playwright@1.56.1
      - name: Qualify the real browser inference path
        shell: bash
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 --directory web > /tmp/xrai-qualification.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for n in 1 2 3 4 5; do curl -fsS http://127.0.0.1:8765/ > /dev/null && break || sleep 1; done
          xvfb-run -a node test/model-qualification.e2e.mjs http://127.0.0.1:8765/
      - name: Upload model qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: model-qualification
          path: artifacts/model-qualification/
          if-no-files-found: warn
          retention-days: 7
