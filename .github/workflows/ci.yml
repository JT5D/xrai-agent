name: XRAI source CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-ci-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm run check
      - name: Verify browser-to-server execution contract
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.1
          node test/server-ui.e2e.mjs
      - name: Upload execution contract evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-ui-contract
          path: artifacts/server-ui/
          retention-days: 7

  # Advisory on PRs. The required publication gate remains in pages.yml; a known
  # weak production model must not block verified architecture/test refactors from
  # merging, but it still cannot reach production until release preflight passes.
  model-observation:
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser runner
        run: npm install --no-save --ignore-scripts playwright@1.56.1
      - name: Observe active browser inference path
        shell: bash
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 --directory web > /tmp/xrai-qualification.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for n in 1 2 3 4 5; do curl -fsS http://127.0.0.1:8765/ > /dev/null && break || sleep 1; done
          xvfb-run -a node test/model-qualification.e2e.mjs http://127.0.0.1:8765/ production
      - name: Upload active-model evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: model-qualification-production
          path: artifacts/model-qualification-production/
          if-no-files-found: warn
          retention-days: 7

  # Single evidence-backed browser candidate. Liquid's official ONNX export
  # documents Q4 WebGPU use for this instruction model; production remains unchanged.
  model-candidate-observation:
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser runner
        run: npm install --no-save --ignore-scripts playwright@1.56.1
      - name: Qualify LFM2.5 1.2B Instruct off-path
        shell: bash
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 --directory web > /tmp/xrai-candidate.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for n in 1 2 3 4 5; do curl -fsS http://127.0.0.1:8765/ > /dev/null && break || sleep 1; done
          xvfb-run -a node test/model-qualification.e2e.mjs http://127.0.0.1:8765/ lfm12b
      - name: Upload candidate-model evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: model-qualification-lfm12b-candidate
          path: artifacts/model-qualification-lfm12b/
          if-no-files-found: warn
          retention-days: 7
